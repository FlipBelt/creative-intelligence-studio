name: CIS cloud checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cis-cloud-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and preview baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check toolchain, preview, tests, and static build
        run: npm run check:cloud

  devcontainer:
    name: Dev container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source and preview baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node for the container CLI
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install the pinned container CLI
        run: npm install --global --prefix "$RUNNER_TEMP/devcontainer-cli" @devcontainers/cli@0.89.0 --ignore-scripts --no-audit --no-fund
      - name: Build and start the development container
        run: '"$RUNNER_TEMP/devcontainer-cli/bin/devcontainer" up --workspace-folder "$GITHUB_WORKSPACE" --remove-existing-container'
      - name: Run the same checks inside the container
        run: '"$RUNNER_TEMP/devcontainer-cli/bin/devcontainer" exec --workspace-folder "$GITHUB_WORKSPACE" npm run check:cloud'
